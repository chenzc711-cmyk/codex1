<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天猫店铺仓库管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>天猫店铺仓库管理系统</h1>
    <button id="exportBtn">导出数据(JSON)</button>
  </header>

  <main class="layout">
    <section class="card dashboard">
      <h2>仪表盘</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card form-card">
      <h2>手动添加商品</h2>
      <form id="productForm" class="grid-form">
        <input name="name" placeholder="商品名称" required />
        <input name="spec" placeholder="商品规格" required />
        <input name="cost" type="number" min="0" step="0.01" placeholder="商品成本" required />
        <input name="packCost" type="number" min="0" step="0.01" placeholder="打包成本" required />
        <input name="stock" type="number" min="0" step="1" placeholder="在库数量" required />
        <button type="submit">添加商品</button>
      </form>
    </section>

    <section class="card batch-card">
      <h2>批量添加商品</h2>
      <p class="hint">每行一条，格式：商品名称,商品规格,商品成本,打包成本,在库数量</p>
      <textarea id="batchInput" rows="6" placeholder="示例：\n短袖T恤,M白色,39.9,2.5,120"></textarea>
      <div class="batch-actions">
        <input id="csvFile" type="file" accept=".csv,.txt" />
        <button id="batchAddBtn">批量导入</button>
      </div>
    </section>

    <section class="card stock-card">
      <h2>出入库记录</h2>
      <form id="stockForm" class="grid-form stock-op">
        <select name="productId" id="productSelect" required></select>
        <select name="type" required>
          <option value="in">入库</option>
          <option value="out">出库</option>
        </select>
        <input name="qty" type="number" min="1" step="1" placeholder="数量" required />
        <input name="remark" placeholder="备注（可选）" />
        <button type="submit">登记记录</button>
      </form>
      <div id="recordTable"></div>
    </section>

    <section class="card table-card">
      <h2>商品清单</h2>
      <div id="productTable"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
